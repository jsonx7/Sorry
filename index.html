<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>¿Me perdonas?</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{font-family:Nunito,sans-serif;background-color:var(--bg-color,#fdf2f8);overflow-x:hidden}
  h1{font-family:'Fredoka One',cursive}
  .btn-transition{transition:all .2s ease}
  #game-area{position:relative;width:100%;max-width:500px;height:200px;margin:0 auto;border-radius:1rem}
  .retro-window{background:silver;border:2px solid;border-color:#fff grey grey #fff;box-shadow:4px 4px 10px rgba(0,0,0,.5);max-width:300px;width:90%}
  .retro-header{background:navy;color:#fff;padding:4px 8px;font-weight:700;font-family:monospace;display:flex;justify-content:space-between;align-items:center}
  @keyframes shake{
    0%{transform:translate(1px,1px) rotate(0)}
    10%{transform:translate(-1px,-2px) rotate(-1deg)}
    20%{transform:translate(-3px,0) rotate(1deg)}
    30%{transform:translate(3px,2px) rotate(0)}
    40%{transform:translate(1px,-1px) rotate(1deg)}
    50%{transform:translate(-1px,2px) rotate(-1deg)}
    60%{transform:translate(-3px,1px) rotate(0)}
    70%{transform:translate(3px,1px) rotate(-1deg)}
    80%{transform:translate(-1px,-1px) rotate(1deg)}
    90%{transform:translate(1px,2px) rotate(0)}
    100%{transform:translate(1px,-2px) rotate(-1deg)}
  }
  .shaking{animation:shake .5s;animation-iteration-count:1}
  .cat-emoji{position:fixed;top:-50px;font-size:2rem;user-select:none;pointer-events:none;z-index:9999}
</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 relative">

  <!-- Loader -->
  <div id="loader" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-[#f5f7fa] transition-opacity duration-500">
    <svg class="animate-pulse w-12 h-12 text-pink-500 mb-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    <span class="text-pink-600 font-medium tracking-widest uppercase">Cargando...</span>
  </div>

  <main class="text-center w-full max-w-md relative z-10">
    <h1 id="main-title" class="text-4xl md:text-5xl text-pink-600 mb-6 drop-shadow-sm"></h1>

    <div class="relative w-64 h-64 mx-auto mb-8 group">
      <img id="main-image" src="" alt="Imagen central" class="w-full h-full object-cover rounded-full border-4 border-pink-400 shadow-xl z-10 relative transition-transform duration-300 hover:scale-105">
      <p id="subtitle-phrase" class="mt-4 text-gray-600 italic font-medium"></p>
    </div>

    <div id="game-area" class="flex items-center justify-center">
      <button id="btn-yes" class="absolute left-1/4 transform -translate-x-1/2 bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-full shadow-lg btn-transition flex items-center gap-2 text-xl z-20"><span>Sí</span> 💖</button>
      <button id="btn-no" class="absolute right-1/4 transform translate-x-1/2 bg-red-500 text-white font-bold py-3 px-8 rounded-full shadow-lg btn-transition text-xl z-20 cursor-pointer">No 😠</button>
    </div>
  </main>

  <!-- Modal de error -->
  <div id="error-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="retro-window shaking">
      <div class="retro-header">
        <span>System Error</span>
        <button id="btn-modal-close-x" class="text-xs bg-gray-300 text-black px-1 border border-gray-500 cursor-pointer">X</button>
      </div>
      <div class="p-6 flex flex-col items-center bg-gray-200 text-black">
        <div class="flex items-center gap-4 mb-4">
          <div class="text-4xl">❌</div>
          <p class="font-mono text-left"><strong>Error 404:</strong><br>Opción "No perdonar" no encontrada en la base de datos del corazón.<br><br>Reinicio inminente...</p>
        </div>
        <button id="btn-modal-accept" class="bg-gray-300 border-2 border-gray-600 px-4 py-1 active:border-gray-800 active:bg-gray-400 font-mono">Aceptar</button>
      </div>
    </div>
  </div>

<script>
  // ───────── PERSONALIZACIÓN: edita estos valores ─────────
  const CONFIG = {
    pageTitle: '¿Me perdonas?',
    mainQuestion: '¿Me perdonas?',
    subtitlePhrase: 'Prometo no volver a hacerlo :(',
    celebrationPhrase: '¡SABÍA QUE ME QUERIAS! 😻',
    backgroundColor: '#fdf2f8',
    imageInitial: 'https://res.cloudinary.com/dsgtnbq6l/image/upload/f_auto,q_auto:low:sensitive,c_scale,w_200/v1763842406/img_k6pk55.png',
    imageCelebration: 'https://res.cloudinary.com/dsgtnbq6l/image/upload/f_auto,q_auto:low:sensitive,c_scale,w_200/v1763842406/img_3_lhjx3z.png'
  };
  // ────────────────────────────────────────────────────────

  document.title = CONFIG.pageTitle;
  document.documentElement.style.setProperty('--bg-color', CONFIG.backgroundColor);

  const $ = (id) => document.getElementById(id);
  const title = $('main-title');
  const subtitle = $('subtitle-phrase');
  const image = $('main-image');
  const btnYes = $('btn-yes');
  const btnNo = $('btn-no');
  const gameArea = $('game-area');
  const modal = $('error-modal');

  title.textContent = CONFIG.mainQuestion;
  subtitle.textContent = CONFIG.subtitlePhrase;
  image.src = CONFIG.imageInitial;

  // Ocultar loader
  window.addEventListener('load', () => {
    const loader = $('loader');
    loader.style.opacity = '0';
    setTimeout(() => { loader.style.display = 'none'; }, 500);
  });

  const reload = () => location.reload();
  $('btn-modal-accept').addEventListener('click', reload);
  $('btn-modal-close-x').addEventListener('click', reload);

  // El botón "No" huye
  function moveNoButton() {
    const area = gameArea.getBoundingClientRect();
    const btn = btnNo.getBoundingClientRect();
    const x = Math.floor(Math.random() * (area.width - btn.width));
    const y = Math.floor(Math.random() * (area.height - btn.height));
    btnNo.style.position = 'absolute';
    btnNo.style.left = x + 'px';
    btnNo.style.top = y + 'px';
    btnNo.style.transform = 'none';
    btnNo.style.right = 'auto';
  }
  btnNo.addEventListener('mouseover', moveNoButton);
  btnNo.addEventListener('touchstart', (e) => { e.preventDefault(); moveNoButton(); });
  btnNo.addEventListener('click', () => {
    modal.classList.remove('hidden');
    setTimeout(reload, 3500);
  });

  // Celebración
  btnYes.addEventListener('click', () => {
    title.textContent = CONFIG.celebrationPhrase;
    title.classList.add('text-green-600');
    btnYes.style.display = 'none';
    btnNo.style.display = 'none';
    image.src = CONFIG.imageCelebration;
    rainCats();
  });

  function rainCats() {
    const emojis = ['🐱','😸','😹','😻','😼','😽','😿','😾','💖','✨'];
    const end = Date.now() + 3000;

    function drop() {
      const el = document.createElement('div');
      el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      el.className = 'cat-emoji';
      el.style.left = Math.random() * 100 + 'vw';
      const secs = Math.random() * 3 + 2;
      el.animate(
        [
          { transform: 'translateY(-10vh) rotate(0deg)' },
          { transform: 'translateY(110vh) rotate(' + Math.random() * 360 + 'deg)' }
        ],
        { duration: secs * 1000, easing: 'linear', fill: 'forwards' }
      );
      document.body.appendChild(el);
      setTimeout(() => el.remove(), secs * 1000);
    }

    const timer = setInterval(() => {
      if (Date.now() > end) clearInterval(timer);
      drop(); drop(); drop();
    }, 50);
  }
</script>
</body>
</html>
